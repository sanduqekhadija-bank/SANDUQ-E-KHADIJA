<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanduq e Khadija Bank</title>
<meta name="theme-color" content="#0a7d4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  body{font-family:sans-serif;max-width:420px;margin:0 auto;padding:0 16px 24px;color:#222}
  .top{background:#0a7d4f;color:#fff;margin:0 -16px 12px;padding:16px;text-align:center;font-size:20px;font-weight:bold}
  input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}
  button{background:#0a7d4f;color:#fff;border:0;border-radius:6px}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tabs button{flex:1;width:auto;padding:10px 4px;font-size:14px;background:#d6e9df;color:#0a7d4f}
  .tabs button.on{background:#0a7d4f;color:#fff}
  .tabs.wrap{flex-wrap:wrap}
  .tabs.wrap button{flex:1 1 40%}
  textarea{width:100%;box-sizing:border-box;font-size:15px;padding:8px;margin-top:8px}
  .wa{display:block;text-align:center;background:#25d366;color:#fff;padding:12px;border-radius:6px;margin:6px 0;cursor:pointer}
  .card{background:#f2f7f4;padding:14px;border-radius:8px;margin-top:14px;line-height:1.7}
  .big{font-size:20px;font-weight:bold}
  .ok{color:#0a7d4f}.bad{color:#c0392b}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
  td,th{padding:6px 4px;border-bottom:1px solid #ddd;text-align:left}
  .link{color:#0a7d4f;text-decoration:underline;text-align:center;margin-top:30px;cursor:pointer}
  .hidden{display:none}
</style>
</head>
<body>
<div class="top">Sanduq e Khadija Bank</div>

<div id="memberBox">
  <input id="acc" placeholder="Account Number" inputmode="numeric">
  <input id="pin" type="password" placeholder="PIN">
  <button onclick="login()">Mera Hisaab Dekhein</button>
  <div id="out"></div>
  <button id="install" class="hidden" style="background:#d6e9df;color:#0a7d4f">App install karein</button>
  <div class="link" onclick="toggle(true)">Admin</div>
</div>

<div id="adminBox" class="hidden">
  <h3>Admin: Entry karein</h3>
  <input id="apw" type="password" placeholder="Admin Password">
  <div class="tabs wrap">
    <button id="tJ" class="on" onclick="setMode('Jama')">Monthly Jama</button>
    <button id="tD" onclick="setMode('Loan Diya')">Loan Diya</button>
    <button id="tW" onclick="setMode('Loan Wapas')">Kist Wapas</button>
    <button id="tP" onclick="setMode('Loan Pass')">Loan Pass Message</button>
    <button id="tC" onclick="setMode('Close')">Account Band</button>
  </div>
  <input id="eacc" placeholder="Member Account Number" inputmode="numeric">
  <input id="eamt" type="number" placeholder="Amount" value="1000">
  <div id="dpbox">
    <div style="font-size:13px;color:#555;margin-top:6px">Tareekh</div>
    <input id="edate" type="date">
    <div style="font-size:13px;color:#555;margin-top:6px">Kaise mila?</div>
    <div class="tabs">
      <button id="mB" onclick="setPay('Bank')">Bank</button>
      <button id="mC" onclick="setPay('Cash')">Cash</button>
    </div>
  </div>
  <div id="zbox" class="hidden">
    <input id="z1" placeholder="Zamin 1 ka Account Number" inputmode="numeric">
    <input id="z2" placeholder="Zamin 2 ka Account Number" inputmode="numeric">
  </div>
  <button id="chk" onclick="check()">Pehle Check Karein</button>
  <div id="aout"></div>
  <div class="link" onclick="toggle(false)">Wapas</div>
</div>

<script>
// Yahan apna Apps Script Web app URL paste karein (https://script.google.com/macros/s/.../exec)
const API = 'https://script.google.com/macros/s/AKfycbyKfa_rcXnDiYdZxea42MeSlV0HsY5QDiJAyyDSzfK8HPGL5ysC9df_h7Bvsk4L696L/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => '₹' + Number(n).toLocaleString('en-IN');

function api(body) {
  if (API.indexOf('PASTE') >= 0) return Promise.reject(new Error('NOAPI'));
  const ctl = new AbortController();
  const timer = setTimeout(function () { ctl.abort(); }, 30000);
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    signal: ctl.signal
  }).then(function (r) { return r.text(); }).then(function (t) {
    clearTimeout(timer);
    try { return JSON.parse(t); }
    catch (x) { throw new Error('BADREPLY'); }
  }).catch(function (e) {
    clearTimeout(timer);
    if (e && e.name === 'AbortError') throw new Error('TIMEOUT');
    throw e;
  });
}
function errText(e) {
  const m = e && e.message;
  if (m === 'NOAPI') return 'App ka API link abhi set nahi hua (index.html me).';
  if (m === 'BADREPLY') return 'Server ka jawab galat aaya. Apps Script me doPost wala code aur New version deploy check karein.';
  if (m === 'TIMEOUT') return 'Server se jawab nahi aaya (bahut der lagi). Dobara koshish karein.';
  return 'Internet check karein, phir dobara koshish karein. (' + (m || 'error') + ')';
}

let pend = null;
let mode = 'Jama';
let mode2 = '';
function setPay(m) {
  mode2 = m; pend = null;
  $('mB').classList.toggle('on', m === 'Bank');
  $('mC').classList.toggle('on', m === 'Cash');
  $('aout').textContent = '';
}
function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
$('edate').value = today();
const label = { 'Jama': 'Monthly Jama', 'Loan Diya': 'Loan Diya', 'Loan Wapas': 'Kist Wapas' };

function toggle(a) {
  $('memberBox').classList.toggle('hidden', a);
  $('adminBox').classList.toggle('hidden', !a);
}
function setMode(t) {
  mode = t; pend = null;
  $('tJ').classList.toggle('on', t === 'Jama');
  $('tD').classList.toggle('on', t === 'Loan Diya');
  $('tW').classList.toggle('on', t === 'Loan Wapas');
  $('tP').classList.toggle('on', t === 'Loan Pass');
  $('tC').classList.toggle('on', t === 'Close');
  $('eamt').classList.toggle('hidden', t === 'Close');
  $('dpbox').classList.toggle('hidden', t === 'Loan Pass');
  $('chk').textContent = t === 'Loan Pass' ? 'Message Banayein' : 'Pehle Check Karein';
  $('eamt').value = t === 'Jama' ? 1000 : '';
  $('zbox').classList.toggle('hidden', t !== 'Loan Diya');
  $('aout').textContent = '';
}
function fail(e) { $('out').innerHTML = '<span class="bad">' + esc(errText(e)) + '</span>'; }
function fail2(e) { $('aout').innerHTML = '<span class="bad">' + esc(errText(e)) + '</span>'; }

let lastMember = { acc: '', naam: '' };
let payWa = '';
function login() {
  $('out').textContent = 'Ruk jayein...';
  const acc = $('acc').value;
  api({ action: 'login', acc: acc, pin: $('pin').value }).then(function (r) {
    if (!r.ok) { $('out').innerHTML = '<span class="bad">' + esc(r.msg || 'Account number ya PIN galat hai.') + '</span>'; return; }
    lastMember = { acc: String(acc).trim(), naam: r.data.naam };
    payWa = (r.pay && r.pay.wa) || '';
    $('out').innerHTML = render(r.data) + payBox(r.pay);
  }).catch(fail);
}

function payBox(p) {
  if (!p) return '';
  return '<div class="card"><b>Paisa bhejne ke liye</b>' +
    '<img src="qr.png" alt="" onerror="this.remove()" style="width:100%;max-width:260px;display:block;margin:8px auto">' +
    'UPI ID: <b id="upiid">' + esc(p.upi) + '</b>' + (p.name ? '<br>Naam: ' + esc(p.name) : '') +
    '<button onclick="copyUpi()">UPI ID Copy Karein</button><span id="upiok" class="ok"></span>' +
    '<br>Paisa bhejne ke baad screenshot bank ko bhejein.' +
    (p.wa ? '<div class="wa" onclick="waShot()">WhatsApp par screenshot bhejein</div>' : '') + '</div>';
}
function copyUpi() {
  const t = $('upiid').textContent;
  const ok = function () { $('upiok').textContent = ' Copy ho gaya.'; };
  const no = function () { $('upiok').textContent = ' Haath se copy karein.'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok).catch(no);
  else no();
}
function waShot() {
  const msg = 'Salamun Alaikum, mera Account No ' + lastMember.acc + ' (' + lastMember.naam + ') hai. Maine paisa bheja hai, screenshot bhej raha hoon.';
  window.open('https://wa.me/' + payWa + '?text=' + encodeURIComponent(msg), '_blank');
}

function render(d) {
  let h = '<div class="card"><div class="big">' + esc(d.naam) + '</div>' +
    'Kul Jama: <b>' + rs(d.jama) + '</b> (' + d.months + ' mahine)<br>';
  if (d.diya > 0) {
    h += 'Loan Liya: ' + rs(d.diya) + '<br>Wapas Kiya: ' + rs(d.wapas) + '<br>' +
         '<b>Baaki (Pending) Loan: ' + rs(d.pending) + '</b><br>';
    if (d.pending > 0) {
      h += 'Mahana Kist: ' + rs(d.kist) + ' | Baaki Kist: ' + d.baaki + '<br>';
      if (d.zamin.length) h += 'Aapke Zamin: ' + d.zamin.map(esc).join(', ') + '<br>';
    }
  } else {
    h += 'Loan: koi nahi<br>';
  }
  if (d.zaminLoans > 0)
    h += 'Aap ' + d.zaminLoans + ' loan me zamin hain (zyada se zyada ' + d.maxZamin + ')<br>';
  if (d.pending > 0) { /* loan chal raha hai */ }
  else if (d.eligible) h += '<span class="ok">✔ Aap loan ke liye eligible hain.</span>';
  else h += 'Loan ke liye ' + d.minMonths + ' mahine jama hone zaroori hain.';
  h += '</div>';
  if (d.hist.length) {
    h += '<table><tr><th>Tareekh</th><th>Kya</th><th>Rakam</th></tr>';
    d.hist.forEach(function (x) {
      h += '<tr><td>' + esc(x.d) + '</td><td>' + esc(x.t) + (x.md ? ' (' + esc(x.md) + ')' : '') + '</td><td>' + rs(x.a) + '</td></tr>';
    });
    h += '</table>';
  }
  return h;
}

let waNum = '';
function passMsg() {
  $('aout').textContent = 'Ruk jayein...';
  api({ action: 'passmsg', pw: $('apw').value, acc: $('eacc').value, amt: $('eamt').value }).then(function (r) {
    if (!r.ok) { $('aout').innerHTML = '<span class="bad">' + esc(r.msg) + '</span>'; return; }
    waNum = r.wa || '';
    $('aout').innerHTML = '<div class="card"><b>' + esc(r.naam) + '</b>' +
      (r.warn ? '<br><span class="bad">' + esc(r.warn) + '</span>' : '') +
      (waNum ? '' : '<br><span class="bad">Is member ka mobile number Members tab me nahi hai.</span>') + '</div>' +
      '<textarea id="msgtxt" rows="12">' + esc(r.text) + '</textarea>' +
      '<div class="wa" onclick="openWa()">WhatsApp par bhejein</div>' +
      '<button onclick="copyMsg()">Message Copy Karein</button><div id="copied" class="ok"></div>';
  }).catch(fail2);
}
function openWa() {
  window.open('https://wa.me/' + waNum + '?text=' + encodeURIComponent($('msgtxt').value), '_blank');
}
function copyMsg() {
  const t = $('msgtxt'); t.select();
  try { document.execCommand('copy'); $('copied').textContent = 'Copy ho gaya.'; }
  catch (e) { $('copied').textContent = 'Message ko select karke haath se copy karein.'; }
}

function closeCheck() {
  const pw = $('apw').value, acc = $('eacc').value, dt = $('edate').value, md = mode2;
  if (!md) { $('aout').innerHTML = '<span class="bad">Pehle Bank ya Cash chunein (paisa kaise wapas diya).</span>'; return; }
  $('aout').textContent = 'Ruk jayein...';
  api({ action: 'closeprev', pw: pw, acc: acc }).then(function (r) {
    if (!r.ok) { $('aout').innerHTML = '<span class="bad">' + esc(r.msg) + '</span>'; return; }
    pend = { pw: pw, acc: acc, dt: dt, md: md };
    $('aout').innerHTML = '<div class="card"><b>' + esc(r.naam) + '</b><br>Wapas dene wala paisa: <b>' + rs(r.balance) + '</b>' +
      '<br>Tareekh: ' + esc(dt.split('-').reverse().join('-')) + '<br>Kaise: ' + esc(md) +
      '<br><span class="bad">Account hamesha ke liye band ho jayega.</span></div>' +
      '<button onclick="doClose()">Haan, Account Band Karein</button>';
  }).catch(fail2);
}

function doClose() {
  if (!pend) return;
  const p = pend; pend = null;
  $('aout').textContent = 'Ruk jayein...';
  api({ action: 'close', pw: p.pw, acc: p.acc, dt: p.dt, md: p.md }).then(function (r) {
    if (!r.ok) { $('aout').innerHTML = '<span class="bad">' + esc(r.msg) + '</span>'; return; }
    $('aout').innerHTML = '<div class="card"><b class="ok">' + esc(r.msg) + '</b><br>' + esc(r.naam) +
      '<br>Wapas diya gaya paisa: <b>' + rs(r.balance) + '</b></div>';
    $('eacc').value = '';
  }).catch(fail2);
}

function check() {
  if (mode === 'Loan Pass') { passMsg(); return; }
  if (mode === 'Close') { closeCheck(); return; }
  const pw = $('apw').value, acc = $('eacc').value, type = mode, amt = $('eamt').value;
  const z1 = $('z1').value, z2 = $('z2').value, dt = $('edate').value, md = mode2;
  if (type !== 'Loan Diya' && !md) { $('aout').innerHTML = '<span class="bad">Pehle Bank ya Cash chunein.</span>'; return; }
  $('aout').textContent = 'Ruk jayein...';
  api({ action: 'lookup', pw: pw, acc: acc,
        z1: type === 'Loan Diya' ? z1 : '', z2: type === 'Loan Diya' ? z2 : '' }).then(function (r) {
    if (!r.ok) { $('aout').innerHTML = '<span class="bad">' + esc(r.msg) + '</span>'; return; }
    pend = { pw: pw, acc: acc, type: type, amt: amt, z1: z1, z2: z2, dt: dt, md: md };
    let h = '<div class="card"><b>' + esc(r.naam) + '</b><br>' + esc(label[type]) + ': ' + rs(amt) + '<br>Tareekh: ' + esc(dt.split('-').reverse().join('-')) + (md ? '<br>Kaise: ' + esc(md) : '');
    if (type === 'Loan Diya') h += '<br>Zamin: ' + (r.zn.length ? r.zn.map(esc).join(', ') : '-');
    h += '</div><button onclick="doSave()">Haan, Save Karein</button>';
    $('aout').innerHTML = h;
  }).catch(fail2);
}

function doSave() {
  if (!pend) return;
  const p = pend; pend = null;
  $('aout').textContent = 'Save ho raha hai...';
  api({ action: 'add', pw: p.pw, acc: p.acc, type: p.type, amt: p.amt, z1: p.z1, z2: p.z2, dt: p.dt, md: p.md }).then(function (r) {
    if (!r.ok) { $('aout').innerHTML = '<span class="bad">' + esc(r.msg) + '</span>'; return; }
    $('aout').innerHTML = '<b class="ok">' + esc(r.msg) + '</b>' + render(r.data);
    $('eacc').value = ''; $('z1').value = ''; $('z2').value = ''; $('edate').value = today();
  }).catch(fail2);
}

// Enter dabane se bhi login ho
$('acc').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('pin').focus(); });
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

// Chrome me "App install karein" button
let deferred = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); deferred = e; $('install').classList.remove('hidden');
});
$('install').onclick = function () {
  if (!deferred) return;
  deferred.prompt(); deferred = null; $('install').classList.add('hidden');
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
